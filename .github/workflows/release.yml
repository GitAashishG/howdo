name: Release

on:
  push:
    tags: ['v*']

# Intentional, versioned releases only. Concurrent tags cannot race publication.
concurrency:
  group: howdo-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag, manifest, and lockfile versions agree
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          tag = os.environ['GITHUB_REF_NAME']
          with open('Cargo.toml', 'rb') as file:
              version = tomllib.load(file)['package']['version']
          with open('Cargo.lock', 'rb') as file:
              locked = next(p['version'] for p in tomllib.load(file)['package'] if p['name'] == 'howdo')
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) or tag != 'v' + version or locked != version:
              raise SystemExit('Release tag, Cargo.toml, and Cargo.lock must have the same stable version')
          PY

  checks:
    uses: ./.github/workflows/test.yml

  build:
    needs: [validate, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: howdo-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            name: howdo-aarch64-apple-darwin
          # Ubuntu 22.04 keeps the Linux binary compatible with glibc 2.35+.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: howdo-x86_64-unknown-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: howdo-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the tagged source without changing its version
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Prepare binary
        shell: bash
        run: |
          BINARY=target/${{ matrix.target }}/release/howdo
          if [ "${{ runner.os }}" = "Windows" ]; then BINARY="$BINARY.exe"; fi
          cp "$BINARY" "${{ matrix.name }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  release:
    needs: [validate, checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum howdo-* > SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'artifacts/*'
          create-storage-record: false
      - name: Publish verified release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: legacy
