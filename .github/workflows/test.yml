name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --all-targets --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Integration and installer regression tests
        shell: bash
        run: |
          BINARY=./target/release/howdo
          if [ "${{ runner.os }}" = "Windows" ]; then BINARY="$BINARY.exe"; fi
          python tests/test_cli.py "$BINARY"
          python tests/test_installers.py
      - name: Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

  quality:
    name: Dependency and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2,actionlint,shellcheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python test-tool lint and formatting
        run: |
          python -m pip install -r tests/requirements-dev.txt
          ruff check tests
          ruff format --check tests
      - name: Dependency audit
        run: cargo audit --deny warnings
      - name: Workflow lint
        run: actionlint
      - name: Shell lint
        run: shellcheck install.sh tests/test_providers.sh tests/bench.sh

  msrv:
    name: Minimum supported Rust (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --all-targets --locked
