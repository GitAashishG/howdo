[package]
name = "howdo"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Natural language to terminal commands"
license = "MIT"
repository = "https://github.com/GitAashishG/howdo"
homepage = "https://github.com/GitAashishG/howdo"
keywords = ["cli", "terminal", "llm", "ai", "natural-language"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minreq = { version = "3", features = ["https"] }
crossterm = "0.29"
rustyline = "18"
rpassword = "7.5"
semver = "1"
sha2 = "0.10"
tempfile = "3"
url = "2.5"

[profile.release]
strip = true
lto = true

[[bin]]
name = "howdo"
path = "src/main.rs"
